<!doctype html>
<!-- Longo Display app icon (1024×1024). Render with scripts/icon/render-icon.sh. -->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; }
      .tile {
        position: absolute; left: 100px; top: 100px; width: 824px; height: 824px; border-radius: 185px;
        background: radial-gradient(500px 420px at 30% 20%, #2b2533 0%, #15131c 60%, #0d0c12 100%);
        box-shadow: inset 0 2px 0 rgb(255 255 255 / 0.12), 0 24px 60px rgb(0 0 0 / 0.45);
      }
      .glow { position: absolute; left: 230px; top: 260px; width: 560px; height: 420px; border-radius: 50%;
        background: radial-gradient(closest-side, rgb(255 107 53 / 0.45), rgb(139 92 246 / 0.25), transparent); filter: blur(30px); }
      svg { position: absolute; left: 100px; top: 100px; }
    </style>
  </head>
  <body>
    <div class="tile"></div>
    <div class="glow"></div>
    <svg width="824" height="824" viewBox="0 0 824 824">
      <defs>
        <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ff8a50" />
          <stop offset="0.55" stop-color="#e05cc8" />
          <stop offset="1" stop-color="#8b5cf6" />
        </linearGradient>
        <!-- Straight rays have no width or height, so their stroke gradient needs absolute coordinates. -->
        <linearGradient id="rays" gradientUnits="userSpaceOnUse" x1="-100" y1="-100" x2="100" y2="100">
          <stop offset="0" stop-color="#ff8a50" />
          <stop offset="1" stop-color="#8b5cf6" />
        </linearGradient>
      </defs>
      <!-- Screen -->
      <rect x="170" y="200" width="484" height="320" rx="44" fill="url(#g)" />
      <rect x="196" y="226" width="432" height="268" rx="26" fill="#1a1622" opacity="0.92" />
      <!-- Sun -->
      <g transform="translate(412 360)" stroke="url(#rays)" stroke-width="18" stroke-linecap="round" fill="none">
        <circle r="46" fill="url(#g)" stroke="none" />
        <line x1="0" y1="-78" x2="0" y2="-100" /><line x1="0" y1="78" x2="0" y2="100" />
        <line x1="-78" y1="0" x2="-100" y2="0" /><line x1="78" y1="0" x2="100" y2="0" />
        <line x1="-55" y1="-55" x2="-71" y2="-71" /><line x1="55" y1="55" x2="71" y2="71" />
        <line x1="-55" y1="55" x2="-71" y2="71" /><line x1="55" y1="-55" x2="71" y2="-71" />
      </g>
      <!-- Stand -->
      <rect x="372" y="520" width="80" height="70" fill="url(#g)" />
      <rect x="292" y="588" width="240" height="30" rx="15" fill="url(#g)" />
    </svg>
  </body>
</html>
