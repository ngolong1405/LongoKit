<!doctype html>
<!--
  LongoKit Trinity icons (1024×1024): LongoMouse, LongoDisplay, LongoKeys as gradient line art on an obsidian
  (dark) or porcelain (light) squircle, plus LongoShot, and LongoKit (all four on one tile). Pick one with
  ?icon=mouse|display|keys|shot|share|flow|kit&theme=dark|light. Add &mark=1 for the small mark used in sidebars: just the tile,
  with a bigger glyph, so it reads at 20 pt.
  Render all of them with brand/icons/render.sh.
-->
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      html, body { margin: 0; width: 1024px; height: 1024px; background: transparent; overflow: hidden; }
      svg { display: block; }
    </style>
  </head>
  <body>
    <svg id="icon" width="1024" height="1024" viewBox="0 0 1024 1024" fill="none">
      <defs>
        <radialGradient id="tile-dark" cx="0.3" cy="0.2" r="1">
          <stop offset="0" stop-color="#23242c" />
          <stop offset="0.6" stop-color="#14151b" />
          <stop offset="1" stop-color="#0b0c10" />
        </radialGradient>
        <linearGradient id="tile-light" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" />
          <stop offset="1" stop-color="#eef0f6" />
        </linearGradient>
        <linearGradient id="rim-dark" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.18" />
          <stop offset="1" stop-color="#ffffff" stop-opacity="0.03" />
        </linearGradient>
        <linearGradient id="rim-light" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#000000" stop-opacity="0.04" />
          <stop offset="1" stop-color="#000000" stop-opacity="0.12" />
        </linearGradient>
        <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
          <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#000" flood-opacity="0.35" />
        </filter>
        <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="14" result="blur" />
          <feMerge><feMergeNode in="blur" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>

        <!-- Mouse: solar orange -->
        <linearGradient id="mouse" gradientUnits="userSpaceOnUse" x1="392" y1="320" x2="632" y2="704">
          <stop offset="0" stop-color="#ff6b35" />
          <stop offset="1" stop-color="#ffa26b" />
        </linearGradient>
        <!-- Display: cyan to orange -->
        <linearGradient id="display" gradientUnits="userSpaceOnUse" x1="300" y1="320" x2="724" y2="612">
          <stop offset="0" stop-color="#38bdf8" />
          <stop offset="0.55" stop-color="#a7a3b4" />
          <stop offset="1" stop-color="#ff6b35" />
        </linearGradient>
        <!-- Keys: violet, pink, orange -->
        <linearGradient id="keys" gradientUnits="userSpaceOnUse" x1="262" y1="342" x2="762" y2="682">
          <stop offset="0" stop-color="#a855f7" />
          <stop offset="0.5" stop-color="#ec4899" />
          <stop offset="1" stop-color="#ff6b35" />
        </linearGradient>
        <!-- Shot: teal to orange -->
        <linearGradient id="shot" gradientUnits="userSpaceOnUse" x1="292" y1="292" x2="732" y2="732">
          <stop offset="0" stop-color="#2dd4bf" />
          <stop offset="0.55" stop-color="#38bdf8" />
          <stop offset="1" stop-color="#ff6b35" />
        </linearGradient>
        <!-- Share: emerald, cyan, orange -->
        <linearGradient id="share" gradientUnits="userSpaceOnUse" x1="262" y1="300" x2="762" y2="700">
          <stop offset="0" stop-color="#34d399" />
          <stop offset="0.5" stop-color="#38bdf8" />
          <stop offset="1" stop-color="#ff6b35" />
        </linearGradient>
        <!-- Flow: violet to cyan, the pointer in orange -->
        <linearGradient id="flow" gradientUnits="userSpaceOnUse" x1="232" y1="330" x2="792" y2="690">
          <stop offset="0" stop-color="#a855f7" />
          <stop offset="0.55" stop-color="#38bdf8" />
          <stop offset="1" stop-color="#2dd4bf" />
        </linearGradient>
        <linearGradient id="key" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#a855f7" />
          <stop offset="1" stop-color="#ff5e7a" />
        </linearGradient>
        <linearGradient id="space" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#fde047" />
          <stop offset="1" stop-color="#ff6b35" />
        </linearGradient>
      </defs>

      <g id="tile" filter="url(#shadow)">
        <rect x="100" y="100" width="824" height="824" rx="185" />
      </g>
      <rect id="rim" x="101.5" y="101.5" width="821" height="821" rx="184" fill="none" stroke-width="3" />

      <g id="glyph-mouse" filter="url(#glow)" style="display:none">
        <rect x="358" y="474" width="30" height="90" rx="10" fill="#ff6b35" />
        <rect x="400" y="320" width="224" height="384" rx="104" stroke="url(#mouse)" stroke-width="30" />
        <rect x="496" y="388" width="32" height="76" rx="16" fill="#fde047" />
        <circle cx="512" cy="600" r="18" fill="#ff6b35" />
      </g>

      <g id="glyph-display" filter="url(#glow)" style="display:none">
        <rect x="302" y="322" width="420" height="290" rx="40" stroke="url(#display)" stroke-width="30" />
        <circle cx="512" cy="460" r="42" fill="#fde047" />
        <circle cx="512" cy="386" r="11" fill="#ff6b35" />
        <circle cx="512" cy="534" r="11" fill="#ff6b35" />
        <circle cx="438" cy="460" r="11" fill="#ff6b35" />
        <circle cx="586" cy="460" r="11" fill="#ff6b35" />
        <rect x="497" y="612" width="30" height="74" fill="#38bdf8" />
        <rect x="426" y="676" width="172" height="28" rx="14" fill="#38bdf8" />
      </g>

      <g id="glyph-keys" filter="url(#glow)" style="display:none">
        <rect x="214" y="324" width="596" height="374" rx="56" stroke="url(#keys)" stroke-width="18" />
        <circle cx="742" cy="368" r="6" fill="#10b981" />
        <g id="key-rows" stroke-width="10"></g>
      </g>

      <g id="glyph-shot" filter="url(#glow)" style="display:none">
        <g stroke="url(#shot)" stroke-width="30" stroke-linecap="round" stroke-linejoin="round">
          <path d="M300 404 V352 Q300 300 352 300 H404" />
          <path d="M620 300 H672 Q724 300 724 352 V404" />
          <path d="M724 620 V672 Q724 724 672 724 H620" />
          <path d="M404 724 H352 Q300 724 300 672 V620" />
        </g>
        <circle cx="512" cy="512" r="96" stroke="url(#shot)" stroke-width="26" />
        <circle cx="512" cy="512" r="40" fill="#fde047" />
        <circle cx="620" cy="404" r="16" fill="#ff6b35" />
      </g>

      <g id="glyph-share" filter="url(#glow)" style="display:none">
        <rect x="262" y="440" width="170" height="270" rx="36" stroke="url(#share)" stroke-width="28" />
        <rect x="592" y="440" width="170" height="270" rx="36" stroke="url(#share)" stroke-width="28" />
        <circle cx="347" cy="656" r="12" fill="#34d399" />
        <circle cx="677" cy="656" r="12" fill="#ff6b35" />
        <g stroke="url(#share)" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
          <path d="M347 392 Q512 210 677 392" />
          <path d="M624 380 L677 392 L672 338" />
        </g>
        <circle cx="512" cy="300" r="34" fill="#fde047" />
      </g>

      <g id="glyph-flow" filter="url(#glow)" style="display:none">
        <rect x="222" y="388" width="252" height="184" rx="28" stroke="url(#flow)" stroke-width="26" />
        <rect x="550" y="388" width="252" height="184" rx="28" stroke="url(#flow)" stroke-width="26" />
        <rect x="200" y="622" width="296" height="26" rx="13" fill="url(#flow)" />
        <rect x="528" y="622" width="296" height="26" rx="13" fill="url(#flow)" />
        <g stroke-linecap="round" stroke="#fde047" stroke-width="12" stroke-dasharray="2 26">
          <path d="M392 480 H520" />
        </g>
        <path d="M600 432 V556 L630 528 L652 576 L674 566 L652 520 L692 518 Z" fill="#ff6b35" stroke="#1d1d24" stroke-width="10" stroke-linejoin="round" />
      </g>
    </svg>

    <script>
      const params = new URLSearchParams(location.search);
      const icon = params.get("icon") || "mouse";
      const mark = params.get("mark") === "1";
      const theme = params.get("theme") || "dark";
      document.querySelector("#tile rect").setAttribute("fill", `url(#tile-${theme})`);
      document.getElementById("rim").setAttribute("stroke", `url(#rim-${theme})`);
      // Pale yellow disappears on white; the light tiles use a deeper gold.
      if (theme === "light") {
        for (const node of document.querySelectorAll('[fill="#fde047"], [stop-color="#fde047"]')) {
          node.setAttribute(node.hasAttribute("fill") ? "fill" : "stop-color", "#f5b400");
        }
      }

      // Keyboard keys: two rows of six (in two groups of three), then a key, the space bar and a key.
      const rows = document.getElementById("key-rows");
      const ns = "http://www.w3.org/2000/svg";
      const add = (tag, attributes) => {
        const node = document.createElementNS(ns, tag);
        Object.entries(attributes).forEach(([k, v]) => node.setAttribute(k, v));
        rows.appendChild(node);
      };
      const key = (x, y, w, stroke) => add("rect", { x, y, width: w, height: 56, rx: 14, stroke });
      const columns = [268, 348, 428, 524, 604, 684];
      for (const y of [374, 444]) for (const x of columns) key(x, y, 72, "url(#key)");
      key(268, 514, 82, "url(#key)");
      key(364, 514, 296, "url(#space)");
      key(674, 514, 82, "url(#key)");
      add("rect", { x: 464, y: 539, width: 96, height: 7, rx: 3.5, fill: "#ff6b35", stroke: "none" });

      if (icon === "kit") {
        // LongoKit: the four glyphs on one tile, one per corner.
        const svg = document.getElementById("icon");
        const scale = mark ? 0.56 : 0.5;
        const [near, far] = mark ? [318, 706] : [330, 694];
        [["mouse", near, near + 4], ["display", far, near + 4], ["keys", near, far - 4], ["shot", far, far - 4]].forEach(([name, x, y]) => {
          const glyph = document.getElementById(`glyph-${name}`).cloneNode(true);
          glyph.removeAttribute("id");
          glyph.style.display = "";
          const cell = document.createElementNS("http://www.w3.org/2000/svg", "g");
          cell.setAttribute("transform", `translate(${x - 512 * scale} ${y - 512 * scale}) scale(${scale})`);
          cell.appendChild(glyph);
          svg.appendChild(cell);
        });
      } else {
        document.getElementById(`glyph-${icon}`).style.display = "";
      }

      if (mark) {
        // The small mark: crop to the tile and blow the glyph up.
        const svg = document.getElementById("icon");
        svg.setAttribute("viewBox", "100 100 824 824");
        document.getElementById("tile").removeAttribute("filter");
        if (icon !== "kit") {
          const grow = icon === "keys" ? 1.12 : 1.3; // the keyboard is wide already
          document.getElementById(`glyph-${icon}`).setAttribute("transform", `translate(512 512) scale(${grow}) translate(-512 -512)`);
        }
      }
    </script>
  </body>
</html>
