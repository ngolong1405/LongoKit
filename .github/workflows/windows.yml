name: windows

on:
  push:
    branches: [main, windows]
    paths: ["apps/*-windows/**", "packages/ui-windows/**", ".github/workflows/windows.yml"]
  pull_request:
    paths: ["apps/*-windows/**", "packages/ui-windows/**", ".github/workflows/windows.yml"]
  workflow_dispatch:
    inputs:
      release:
        description: "Release every Windows app at this version (like 0.1.1), with packages/ui-windows/release-notes/<version>.md"
        required: false
        default: ""
      apps:
        description: "Only these apps (like \"share\"); empty releases mouse, display, shot and kit"
        required: false
        default: ""

permissions:
  contents: write

env:
  # Each app: its project, and the .exe it makes.
  APPS: "shot-windows/LongoShot/LongoShot mouse-windows/LongoMouse/LongoMouse display-windows/LongoDisplay/LongoDisplay share-windows/LongoShare/LongoShare kit-windows/LongoKit/LongoKit"

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Tests
        run: dotnet test packages/ui-windows/Tests/LongoKit.Windows.Tests.csproj -c Release --logger "console;verbosity=normal"
      - name: Build
        shell: pwsh
        run: |
          foreach ($app in $env:APPS.Split(" ")) { dotnet build "apps/$app.csproj" -c Release; if ($LASTEXITCODE) { exit 1 } }
      - name: Snapshots (every page, dark and light, English and Vietnamese)
        shell: pwsh
        run: |
          foreach ($app in $env:APPS.Split(" ")) {
            $name = Split-Path $app -Leaf
            $folder = Split-Path (Split-Path $app -Parent) -Parent
            $out = Join-Path $PWD "snapshots/$name"
            $run = Start-Process -FilePath "$((Get-ChildItem "apps/$folder/$name/bin/Release" -Recurse -Filter "$name.exe" | Select-Object -First 1).FullName)" `
                                 -ArgumentList "--snapshot", "`"$out`"" -Wait -PassThru
            if (Test-Path "$out/error.txt") { Get-Content "$out/error.txt" }
            Get-ChildItem $out | Format-Table Name, Length
            if ($run.ExitCode -ne 0) { exit $run.ExitCode }
          }
      - name: Publish (one self-contained .exe per app, for x64 and Arm64)
        shell: pwsh
        run: |
          foreach ($app in $env:APPS.Split(" ")) {
            foreach ($runtime in "win-x64", "win-arm64") {
              dotnet publish "apps/$app.csproj" -c Release -r $runtime --self-contained `
                -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true `
                -o "out/$runtime"
              if ($LASTEXITCODE) { exit 1 }
            }
          }
          Get-ChildItem out -Recurse -Filter *.exe | Format-Table FullName, Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: snapshots
          path: snapshots
      - uses: actions/upload-artifact@v4
        with:
          name: windows-apps
          path: out/*/*.exe
      - name: Release (only when asked, with a version)
        if: github.event.inputs.release != ''
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.event.inputs.release }}
          ONLY: ${{ github.event.inputs.apps }}
        run: |
          $apps = @{ "mouse" = @("LongoMouse", "Longo Mouse"); "display" = @("LongoDisplay", "Longo Display");
                     "shot" = @("LongoShot", "Longo Shot"); "kit" = @("LongoKit", "LongoKit"); "share" = @("LongoShare", "Longo Share") }
          $keys = if ($env:ONLY) { $env:ONLY.Split(" ") } else { @("mouse", "display", "shot", "kit") }
          New-Item -ItemType Directory -Force release | Out-Null
          foreach ($key in $keys) {
            $file, $name = $apps[$key]
            # An app's own notes (share-0.1.0.md), or the shared ones for the version.
            $notes = "packages/ui-windows/release-notes/$key-$env:VERSION.md"
            if (-not (Test-Path $notes)) { $notes = "packages/ui-windows/release-notes/$env:VERSION.md" }
            Copy-Item "out/win-x64/$file.exe" "release/$file-$env:VERSION-x64.exe"
            Copy-Item "out/win-arm64/$file.exe" "release/$file-$env:VERSION-arm64.exe"
            gh release create "$key-windows/v$env:VERSION" "release/$file-$env:VERSION-x64.exe" "release/$file-$env:VERSION-arm64.exe" `
              --target $env:GITHUB_SHA --title "$name for Windows $env:VERSION beta" --notes-file $notes --prerelease --latest=false
            if ($LASTEXITCODE) { exit 1 }
          }
